<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="ClearAP reads invoices, checks them against orders, vendors and past payments, and decides: pay, review, or reject." />
  <meta name="theme-color" content="#171717" />
  <title>ClearAP · Invoice to Decision</title>
  <script>try { const t = localStorage.getItem("clearap-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23171717'/><path d='M9.5 16.5l4.5 4.5 8.5-9.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" aria-label="ClearAP home">
      <span class="logo"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="currentColor"/><path d="M9.5 16.5l4.5 4.5 8.5-9.5" stroke="var(--bg)" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <b>ClearAP</b>
    </a>
    <nav id="nav" aria-label="Main">
      <a href="#/" data-route="dashboard">Overview</a>
      <a href="#/inbox" data-route="inbox">Upload</a>
      <a href="#/queue" data-route="queue">Needs review <span id="queue-count" class="pill-count" hidden></span></a>
      <a href="#/vendors" data-route="vendors">Vendors</a>
      <a href="#/data" data-route="data">Records</a>
      <a href="#/rules" data-route="rules">How it works</a>
    </nav>
    <div class="top-actions">
      <button class="kbd-btn" id="open-cmd" title="Search (⌘K)"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>Search</span><kbd>⌘K</kbd></button>
      <button class="icon-btn" id="theme" title="Switch light / dark" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
      <div class="mode" id="mode" title="Which engine reads the invoices"></div>
      <button class="who" id="who" type="button"></button>
      <a class="btn primary sm hide-sm" href="#/inbox">Upload invoice</a>
    </div>
  </header>
  <main id="app"></main>
  <div id="cmd" class="cmd" hidden>
    <div class="cmd-box" role="dialog" aria-label="Search">
      <input id="cmd-input" placeholder="Search invoices, vendors, pages…" autocomplete="off" />
      <div id="cmd-list" class="cmd-list"></div>
      <div class="cmd-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>
  </div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
